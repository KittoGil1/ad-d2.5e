<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#090c10" />
<meta name="description" content="Crônicas — sua ficha de personagem, seus equipamentos e as histórias da sua campanha de RPG." />
<title>Crônicas — Ficha de Personagem</title>
<script crossorigin src="https://unpkg.com/react@19/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@19/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root {
  color-scheme: dark;
  --background: #090c10;
  --surface: #0e1217;
  --gold: #bd9c6c;
  --gold-light: #e2cda9;
  --gold-border: #5e4e39;
  --red: #b2322e;
  --text: #e3e0d8;
  --muted: #93949b;
  --line: #292c30;
  font-family: 'Inter', sans-serif;
  color: var(--text);
  background: var(--background);
  font-synthesis: none;
}
* { box-sizing: border-box; }
body { margin: 0; min-width: 360px; }
button, input, select, textarea { font: inherit; }
button { color: inherit; cursor: pointer; }
button { transition: background .18s, border-color .18s, color .18s, transform .18s; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
button:disabled { cursor: default; }
button:hover { color: var(--gold-light); }
.icon { flex-shrink: 0; vertical-align: middle; }
.app { min-height: 100vh; background: radial-gradient(ellipse at 85% 42%, #20110f35, transparent 45%), radial-gradient(ellipse at 25% 10%, #24303a20, transparent 50%), var(--background); }
.topbar { height: 76px; display: flex; align-items: center; padding: 0 18px; border-bottom: 1px solid var(--gold-border); background: linear-gradient(180deg, #13151b, #0c0f13); gap: 18px; box-shadow: 0 3px 15px #0007; }
.brand { display: flex; align-items: center; gap: 11px; flex: 0 0 262px; }
.brand-emblem { color: var(--gold); position: relative; display: grid; place-items: center; }
.brand-emblem::after { content: ''; position: absolute; width: 28px; height: 28px; border: 1px solid #9b3f33; transform: rotate(45deg); }
.brand-name { font-family: 'Inter', sans-serif; text-transform: uppercase; font-size: 28px; font-weight: 600; line-height: 1.1; letter-spacing: 2px; color: var(--gold-light); text-shadow: 0 2px 3px #000; }
.brand-caption { font-size: 9px; letter-spacing: 1.8px; color: #b8b3a8; margin-top: 6px; }
.main-nav { display: flex; height: 49px; gap: 2px; flex: 1; min-width: 0; }
.main-nav button, .inventory-tabs button { background: linear-gradient(180deg, #171a2030, #0b0e1280); border: 1px solid #2b2c31; border-radius: 5px 5px 0 0; display: flex; gap: 9px; align-items: center; justify-content: center; padding: 0 14px; font-size: 14px; white-space: nowrap; position: relative; }
.main-nav button { font-size: 13px; padding: 0 10px; gap: 7px; flex: 1; }
.main-nav button .icon { color: #aeb1bd; }
.main-nav button.active, .inventory-tabs button.active { background: linear-gradient(180deg, #32191990, #1b1114); border-color: #6f332a; box-shadow: inset 0 0 15px #a22e1610; color: #f0e6da; }
.main-nav button.active::after, .inventory-tabs button.active::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: #c13e33; box-shadow: 0 0 10px #d4323240; }
.main-nav button.active .icon { color: #d05b4b; }
.main-nav button:hover, .inventory-tabs button:hover { background-color: #3c30292b; }
.header-tools { display: flex; gap: 17px; }
.header-tools button { border: 0; background: none; padding: 3px; color: #b5b7c3; }
.character-switcher { position: relative; align-self: stretch; border-left: 1px solid var(--line); min-width: 162px; }
.character-switcher-button { background: none; border: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 18px; padding-left: 18px; text-align: left; font-size: 15px; }
.character-switcher-button small { display: block; font-size: 11px; color: var(--muted); letter-spacing: .7px; margin-bottom: 4px; text-transform: uppercase; }
.character-switcher-menu { position: absolute; right: 0; top: 68px; width: 240px; z-index: 5; padding: 7px; background: #13171d; border: 1px solid var(--gold-border); box-shadow: 0 10px 30px #000b; }
.character-switcher-label { padding: 8px 11px 6px; color: var(--muted); font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
.character-switcher-menu button { width: 100%; border: 0; background: none; padding: 11px; display: flex; align-items: center; gap: 8px; justify-content: space-between; text-align: left; }
.character-switcher-menu button:hover { background: #b99d7020; }
.character-switcher-menu .new-character-button { justify-content: flex-start; margin-top: 5px; border-top: 1px solid var(--line); color: var(--gold-light); }
.workspace { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 12px; padding: 12px; max-width: 1920px; margin: auto; }
.character-sidebar, .main-frame { position: relative; border: 1px solid var(--gold-border); outline: 1px solid #252522; outline-offset: -5px; border-radius: 7px; background: linear-gradient(110deg, #13171bb0, #090d12d9); box-shadow: inset 0 0 22px #0008, 0 3px 6px #0005; }
.character-sidebar::before, .character-sidebar::after { content: ''; position: absolute; height: 24px; width: 24px; border-color: var(--gold); opacity: .55; pointer-events: none; }
.character-sidebar::before { top: 5px; left: 5px; border-left: 1px solid; border-top: 1px solid; }
.character-sidebar::after { bottom: 5px; right: 5px; border-right: 1px solid; border-bottom: 1px solid; }
.sidebar-inner { padding: 13px; }
.portrait { position: relative; border: 1px solid #aa8758; border-radius: 3px; overflow: hidden; box-shadow: 0 0 0 3px #191c20, 0 0 0 4px #54452f; }
.portrait img { width: 100%; display: block; aspect-ratio: 1.12; object-fit: cover; }
.portrait-edit { position: absolute; top: 7px; right: 7px; width: 29px; height: 29px; background: #15181deb; border: 1px solid #a4977a5c; border-radius: 50%; display: grid; place-items: center; }
.portrait-caption { position: absolute; bottom: 0; left: 0; right: 0; padding: 20px 4px 9px; background: linear-gradient(transparent, #080a10df); text-align: center; font-family: 'Inter', sans-serif; color: #e0c49d; letter-spacing: 2px; font-size: 8px; }
.sidebar-name { font-family: 'Inter', sans-serif; font-size: 31px; text-align: center; font-weight: 600; margin: 10px 0 3px; line-height: 1.3; }
.identity { display: flex; justify-content: space-between; align-items: center; padding: 0 1px; }
.identity > div { display: flex; flex-direction: column; gap: 6px; }
.identity > div span { display: flex; align-items: center; gap: 9px; font-size: 16px; }
.identity .icon { color: #b9b9b4; }
.level { font-size: 21px; color: var(--gold-light); }
.sidebar-xp { display: flex; align-items: center; gap: 9px; margin: 13px 0 4px; border: 1px solid #34373d; padding: 3px; border-radius: 10px; background: #06090d; }
.sidebar-xp > span { font-size: 11px; white-space: nowrap; padding-right: 3px; }
.xp-track { height: 12px; background: linear-gradient(#20232b, #101219); border: 1px solid #66646a; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 3px #000; }
.xp-track > span { display: block; width: 46.4%; height: 100%; border-radius: 7px; background: linear-gradient(#dc5a45, #a02b28 50%, #7a2424); border: 1px solid #e36952; box-shadow: 0 0 8px #c54343; }
.sidebar-xp .xp-track { flex: 1; height: 10px; }
.ornament { display: flex; align-items: center; justify-content: center; gap: 5px; color: #877251; margin: 12px 0; }
.ornament span { height: 1px; flex: 1; background: linear-gradient(90deg, transparent, #655339); }
.ornament span:last-child { transform: rotate(180deg); }
.breath-label { display: flex; justify-content: space-between; align-items: center; font-size: 16px; margin-top: 3px; }
.breath-label button { border: 0; border-radius: 50%; width: 16px; height: 16px; font: 12px 'Inter', sans-serif; background: #868b96; color: #10141b; }
.breath-hearts { display: flex; align-items: center; gap: 6px; margin: 7px 0 16px; }
.breath-hearts button { padding: 0; background: none; border: 0; color: #55575b; }
.breath-hearts button svg { fill: #25292e; stroke-width: 1; }
.breath-hearts button.filled svg { fill: #a63230; color: #db6655; filter: drop-shadow(0 1px 1px #000); }
.breath-hearts button:hover { transform: translateY(-2px); }
.breath-hearts > span { margin-left: auto; color: var(--gold-light); font-size: 18px; white-space: nowrap; }
.sidebar-stats { padding: 3px 9px; border: 1px solid #42403b; border-radius: 4px; background: linear-gradient(90deg, #15191bb0, #090d12); }
.summary-row { display: flex; width: 100%; align-items: center; gap: 10px; border: 0; background: none; padding: 10px 0; border-bottom: 1px solid var(--line); text-align: left; }
.summary-row:last-child { border-bottom: 0; }
.summary-row span { font-size: 13px; flex: 1; }
.summary-row strong { font-size: 16px; font-weight: 400; white-space: nowrap; }
.summary-row .icon { color: #c2c3c9; }
.red-icon { color: #b3423a !important; fill: #a63531; }
.character-motto { text-align: center; margin-top: 12px; }
.character-motto > span { font-family: 'Inter', sans-serif; font-size: 10px; color: #9d9688; letter-spacing: 1.3px; }
.character-motto p { font-size: 19px; font-style: italic; color: #ccc8bd; line-height: 1.5; margin: 9px 0 11px; }
.motto-flourish { font-size: 27px; color: #8e7551; line-height: 1; }
.saved-indicator { display: flex; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; gap: 6px; font-size: 8px; color: #767b7d; margin: 18px 0 3px; }
.saved-indicator > span { width: 4px; height: 4px; border-radius: 50%; background: #78876e; }
.main-frame { padding: 8px; border-color: #35352f; overflow: hidden; }
.hero { position: relative; display: flex; align-items: center; min-height: 155px; padding: 16px 18px; border: 1px solid #3b3730; border-radius: 3px; overflow: hidden; background: #0a1017; gap: 22px; }

.crest { width: 88px; height: 108px; object-fit: contain; position: relative; mix-blend-mode: lighten; }
.hero-identity { z-index: 1; flex: 1; min-width: 0; }
.eyebrow { font-family: 'Inter', sans-serif; font-size: 8px; font-weight: 600; letter-spacing: 2px; color: #9f917d; display: block; margin-bottom: 4px; }
.hero-identity h1 { font-family: 'Inter', sans-serif; font-size: 43px; font-weight: 600; line-height: 1.2; margin: 0 0 4px; letter-spacing: .5px; text-shadow: 0 2px 6px #000; }
.hero-identity h1, .sidebar-name { text-transform: uppercase; }
.hero-meta { display: flex; gap: 9px; align-items: center; font-size: 16px; white-space: nowrap; }
.hero-meta .icon { color: var(--gold); }
.hero-meta i { font-style: normal; color: #6c645a; }
.hero-identity p { font-style: italic; font-size: 17px; color: #cbc8c0; margin: 9px 0 0; letter-spacing: .3px; }
.hero-xp { position: relative; flex: 0 0 220px; padding: 12px 13px 10px; border: 1px solid #796346; outline: 1px solid #79634635; outline-offset: -4px; border-radius: 5px; background: #080c13c9; }
.hero-xp > div:first-child { display: flex; justify-content: space-between; flex-wrap: wrap; margin-bottom: 9px; }
.hero-xp > div > span { font-size: 22px; color: var(--gold-light); }
.hero-xp small { font-size: 12px; align-self: flex-end; }
.hero-xp .next-level { display: block; text-align: center; margin-top: 7px; font-size: 9px; color: #8a8b92; }
.hero-mantra { position: relative; font-family: 'Inter', sans-serif; font-weight: 600; letter-spacing: 2.6px; font-size: 12px; text-align: center; line-height: 1.8; flex: 0 0 130px; color: #c5c4c5; text-shadow: 0 2px 4px #000; }
.attributes-section { border-bottom: 1px solid #24272a; }
.attributes-heading { display: flex; align-items: end; justify-content: space-between; padding: 13px 25px 0; }
.attributes-heading h2 { margin: 1px 0 0; font-size: 18px; font-weight: 500; color: var(--gold-light); }
.attributes-edit { padding: 6px 9px; }
.main-content { padding: 0 2px; }
.attributes { display: grid; grid-template-columns: repeat(6, 1fr); gap: 20px; padding: 12px 24px 14px; }
.attribute { border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; position: relative; }
.attribute-inner { clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); width: 118px; height: 137px; background: var(--gold); position: relative; display: flex; align-items: center; flex-direction: column; justify-content: center; gap: 1px; }
.attribute-inner::before { content: ''; position: absolute; inset: 2px; clip-path: inherit; background: linear-gradient(140deg, #14191f, #090e14 60%, #1c2b36); }
.attribute-inner::after { content: ''; position: absolute; inset: 5px; clip-path: inherit; background: #bba07970; z-index: 0; }
.attribute-inner > * { z-index: 2; position: relative; }
.attribute-inner > .icon { color: var(--gold); margin-bottom: 2px; }
.attribute-label { font-size: 14px; color: var(--gold-light); }
.attribute strong { font-size: 34px; line-height: 1.05; font-weight: 400; }
.attribute-modifier { font-size: 23px; line-height: 1.1; }
.attribute-inner::after { background: linear-gradient(135deg, #14191f, #0b1016 70%, #1b2934); border: 1px solid #786445; }
.attribute.primary .attribute-inner::before { background: #382320; }
.attribute.primary .attribute-inner::after { background: linear-gradient(145deg, #21191b, #160d11 68%, #682922); }
.attribute-fullname { font-family: 'Inter', sans-serif; font-size: 8px; font-weight: 600; letter-spacing: 1.1px; color: #8e887e; margin-top: 6px; }
.attribute:hover { transform: translateY(-3px); }
.attribute:hover .attribute-inner { background: #f0d29b; filter: drop-shadow(0 0 7px #cfaa6030); }
.panel { border: 1px solid var(--gold-border); border-radius: 5px; background: linear-gradient(115deg, #14171ba0, #0b1016d9); box-shadow: inset 0 0 0 2px #14171a, 0 2px 5px #0004; overflow: hidden; }
.panel-heading { display: flex; align-items: center; min-height: 44px; padding: 8px 12px; gap: 10px; border-bottom: 1px solid #383730; background: linear-gradient(90deg, #22201b20, transparent); }
.panel-heading > .icon { color: var(--gold); }
.panel-heading h2 { font-size: 17px; font-weight: 400; margin: 0; flex: 1; white-space: nowrap; }
.panel-content { padding: 8px 12px; }
.details-grid { display: grid; grid-template-columns: 1.32fr .92fr 1.2fr .96fr; gap: 11px; margin-bottom: 12px; }
.small-button { font-size: 11px; border: 1px solid #4a4a4e; border-radius: 4px; background: linear-gradient(#181d23, #0d1117); display: inline-flex; align-items: center; gap: 4px; padding: 4px 7px; white-space: nowrap; }
.small-button:hover { border-color: var(--gold); }
.character-details { margin: 0; }
.character-details > div { display: grid; grid-template-columns: 86px 1fr; gap: 5px; font-size: 12px; margin: 8px 0; }
.character-details dt { color: #a9a9af; }
.character-details dd { margin: 0; line-height: 1.3; }
.defense-row { display: flex; align-items: center; min-height: 36px; gap: 9px; font-size: 12px; border-bottom: 1px solid var(--line); width: 100%; }
.defense-row .icon { color: #b3b5c1; }
.defense-row span { flex: 1; }
.defense-row strong { font-size: 16px; font-weight: 400; white-space: nowrap; }
.hp-row { border-top: 0; border-left: 0; border-right: 0; background: none; padding: 0; text-align: left; }
.saving-label { border: 0; min-height: 32px; }
.saving-stats { padding-left: 33px; }
.saving-stats > div { display: flex; align-items: center; justify-content: space-between; font-size: 12px; padding: 4px 0; }
.saving-stats strong { font-weight: 400; font-size: 14px; }
.skills-column { display: flex; flex-direction: column; gap: 10px; }
.skills-column .panel-heading { gap: 8px; padding-left: 10px; padding-right: 10px; }
.skills-column .panel-heading h2 { font-size: 14px; }
.protection-panel .panel-heading > .icon { color: #c14a43; }
.protection-row { display: flex; width: 100%; padding: 4px 0; border: 0; background: none; align-items: center; gap: 10px; font-size: 12px; text-align: left; }

        <path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7" />
      </>
    ),
    check: <path d="m4 12 5 5L20 6" />,
    tree: (
      <>
        <path d="M12 22V2M12 8 6 3M12 10l7-6M12 14 3 8M12 16l9-8M12 19 4 14M12 20l7-6M8 22h8" />
      </>
    ),
  }
  return (
    <svg
      width={size}
      height={size}
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      strokeWidth="1.5"
      strokeLinecap="round"
      strokeLinejoin="round"
      className={`icon ${className}`}
      aria-hidden="true"
    >
      {paths[name]}
    </svg>
  )
}

function load<T>(key: string, fallback: T): T {
  try {
    return JSON.parse(localStorage.getItem(key) || "null") ?? fallback
  } catch {
    return fallback
  }
}
function profileKey(profileId: string, field: string) {
  return `cronicas-profile-${profileId}-${field}`
}
function Panel({
  title,
  icon,
  children,
  action,
  className = "",
}: {
  title: string

  className?: string
}) {

        <h2>{title}</h2>
        {action}

  )
}

}

function App() {
  const [savedCharacters, setSavedCharacters] = useState<SavedCharacter[]>(
    () => {
      const legacyCharacter = load<Character>(
        "cronicas-character",
        initialCharacter,
      )
      const storedProfiles = load<SavedCharacter[]>("cronicas-profiles", [])
      return storedProfiles.length
        ? storedProfiles
        : [{ id: "regius-default", name: legacyCharacter.name }]
    },
  )
  const [activeCharacterId, setActiveCharacterId] = useState(() => {
    const storedId = load("cronicas-active-profile", "")
    return savedCharacters.some((profile) => profile.id === storedId)
      ? storedId
      : savedCharacters[0].id
  })
  const loadProfile = <T,>(field: string, legacyKey: string, fallback: T): T =>
    load(profileKey(activeCharacterId, field), load(legacyKey, fallback))
  const [character, setCharacter] = useState(() =>
    loadProfile("character", "cronicas-character", initialCharacter),
  )
  const [items, setItems] = useState<Item[]>(() =>
    loadProfile("items", "cronicas-items", initialItems),
  )
  const [stats, setStats] = useState(() =>
    loadProfile("stats", "cronicas-stats", [18, 14, 16, 9, 11, 12]),
  )
  const [breath, setBreath] = useState(() =>
    loadProfile("breath", "cronicas-breath", 4),
  )
  const [notes, setNotes] = useState(() =>
    loadProfile(
      "notes",
      "cronicas-notes",
      "Nossa jornada começa em Vale Sombrio. Há rumores de uma antiga presença nas ruínas ao norte…",
    ),
  )
  const [page, setPage] = useState("Visão Geral")
  const [tab, setTab] = useState("Equipamento")
  const [search, setSearch] = useState("")
  const [filter, setFilter] = useState("Todos")
  const [modal, setModal] = useState<string | null>(null)
  const [roll, setRoll] = useState<number | null>(null)
  const [allSkills, setAllSkills] = useState(false)
  const [characterMenuOpen, setCharacterMenuOpen] = useState(false)
  const [campaign, setCampaign] = useState(() =>
    loadProfile("campaign", "cronicas-campaign", "Vale Sombrio"),
  )
  const [toast, setToast] = useState("")
  useEffect(() => {
    localStorage.setItem(
      profileKey(activeCharacterId, "character"),
      JSON.stringify(character),
    )
    localStorage.setItem(
      profileKey(activeCharacterId, "items"),
      JSON.stringify(items),
    )
    localStorage.setItem(
      profileKey(activeCharacterId, "stats"),
      JSON.stringify(stats),
    )
    localStorage.setItem(
      profileKey(activeCharacterId, "breath"),
      JSON.stringify(breath),
    )
    localStorage.setItem(
      profileKey(activeCharacterId, "notes"),
      JSON.stringify(notes),
    )
    localStorage.setItem(
      profileKey(activeCharacterId, "campaign"),
      JSON.stringify(campaign),
    )
    localStorage.setItem(
      "cronicas-active-profile",
      JSON.stringify(activeCharacterId),
    )
    setSavedCharacters((profiles) =>
      profiles.map((profile) =>
        profile.id === activeCharacterId && profile.name !== character.name
          ? { ...profile, name: character.name }
          : profile,
      ),
    )
  }, [
    activeCharacterId,
    character,
    items,
    stats,
    breath,
    notes,
    campaign,
  ])

            <div className="hero-identity">
              <span className="eyebrow">FICHA DE PERSONAGEM</span>
              <h1>{character.name}</h1>
              <div className="hero-meta">
                {character.race}
                <i>·</i>
                <Icon name="sword" size={15} />
                {character.job}
                <i>·</i>
                <Icon name="sun" size={16} />
                {character.alignment}
              </div>
              <p>“{character.quote}”</p>
            </div>
            <div className="hero-xp">
              <div>
                <span>Nível {character.level}</span>
                <small>6.500 / 14.000 XP</small>
              </div>
              <div className="xp-track">
                <span />
              </div>
              <small className="next-level">
                7.500 XP para o próximo nível
              </small>
            </div>
            <div className="hero-mantra">
              AVENTURA
              <br />
              FORJA
              <br />
              LENDAS
            </div>
          </div>
          <div className="main-content">
            {(page === "Visão Geral" || page === "Armas e Equipamentos") && (
              <>
                <section className="attributes-section">
                  <div className="attributes-heading">
                    <div>
                      <span className="eyebrow">PONTOS DO PERSONAGEM</span>
                      <h2>Atributos</h2>
                    </div>
                    <button
                      className="small-button attributes-edit"
                      onClick={() => setModal("stats")}
                    >
                      <Icon name="edit" size={14} />
                      Editar atributos
                    </button>
                  </div>
                  <div className="attributes">
                    {statLabels.map(([abbr, label, icon], index) => {
                      const modifier = Math.floor((stats[index] - 10) / 2)
                      return (
                        <button
                          key={abbr}
                          className={`attribute ${index === 0 ? "primary" : ""}`}
                          onClick={() => setModal(`stat-${index}`)}
                          aria-label={`Editar ${label}: ${stats[index]}`}
                        >
                          <div className="attribute-inner">
                            <Icon name={icon} size={25} />
                            <span className="attribute-label">{abbr}</span>
                            <strong>{stats[index]}</strong>
                            <span className="attribute-modifier">
                              {modifier >= 0 ? "+" : ""}
                              {modifier}
                            </span>
                          </div>
                          <span className="attribute-fullname">{label}</span>
                        </button>
                      )
                    })}
                  </div>
                </section>
                {page === "Visão Geral" && (
                  <div className="details-grid">
                    <Panel
                      title="Características"
                      icon="book"
                      action={
                        <button
                          className="small-button"
                          onClick={() => setModal("character")}
                        >
                          <Icon name="edit" size={13} />
                          Editar
                        </button>
                      }
                    >
                      <dl className="character-details">
                        {[
                          ["Raça", character.race],
                          ["Classe", character.job],
                          ["Alinhamento", character.alignment],
                          ["Tamanho", "Médio"],
                          ["Velocidade", "9 m (30 pés)"],
                          ["Idiomas", character.languages],
                          [
                            "Proficiências",
                            "Todas as armas, todas as armaduras",
                          ],
                          ["Antecedente", character.background],
                        ].map(([label, value]) => (
                          <div key={label}>
                            <dt>{label}</dt>
                            <dd>{value}</dd>
                          </div>
                        ))}
                      </dl>
                    </Panel>
                    <Panel title="PV e Defesa" icon="shield">
                      <button
                        className="defense-row hp-row"
                        onClick={() => setModal("hp")}
                      >
                        <Icon name="heart" className="red-icon" />
                        <span>Pontos de Vida</span>
                        <strong>
                          {character.hp} / {character.maxHp}
                        </strong>
                      </button>
                      <div className="defense-row">
                        <Icon name="shield" />
                        <span>Classe de Armadura</span>
                        <strong>5</strong>
                      </div>
                      <div className="defense-row">
                        <Icon name="star" />
                        <span>Resistência à Magia</span>
                        <strong>12</strong>
                      </div>
                      <div className="defense-row saving-label">
                        <Icon name="target" />
                        <span>Bônus de Salvação</span>
                      </div>
                      <div className="saving-stats">
                        {[
                          ["Fortitude", "+6"],
                          ["Reflexos", "+4"],
                          ["Vontade", "+4"],
                        ].map(([k, v]) => (
                          <div key={k}>
                            <span>{k}</span>
                            <strong>{v}</strong>
                          </div>
                        ))}
                      </div>
                    </Panel>
                    <div className="skills-column">
                      <Panel
                        title="Lançamentos de Proteção"
                        icon="star"
                        className="protection-panel"
                      >
                        {[
                          ["Proteção contra Magia", "+6"],
                          ["Afastar Mortos-Vivos", "+6"],
                          ["Esconjurar Mortos-Vivos", "+4"],
                        ].map(([k, v]) => (
                          <button
                            className="protection-row"
                            key={k}
                            onClick={() => {
                              setModal("roll")
                              setRoll(null)
                            }}
                          >
                            <Icon name="star" size={17} />
                            <span>{k}</span>
                            <strong>{v}</strong>
                          </button>
                        ))}
                      </Panel>
                      <Panel
                        title="Habilidades do Personagem"
                        icon="sun"
                        action={
                          <button
                            className="small-button"
                            onClick={() => setAllSkills(!allSkills)}
                          >
                            {allSkills ? "Ver menos" : "Ver todas"}
                          </button>
                        }
                      >
                        <div className="skills-grid">
                          {skills.slice(0, allSkills ? 8 : 6).map(([k, v]) => (
                            <div key={k}>
                              <span>{k}</span>
                              <strong>{v}</strong>
                            </div>
                          ))}
                        </div>
                      </Panel>
                    </div>
                    <Panel title="Moedas" icon="coin" className="coins-panel">
                      {[
                        ["Platina", "PP", 2],
                        ["Ouro", "PO", 134],
                        ["Eletro", "PE", 87],
                        ["Prata", "PS", 250],
                        ["Cobre", "PC", 420],
                      ].map(([name, abbr, value], index) => (
                        <div className="coin-row" key={name}>
                          <span className={`coin coin-${index}`}>
                            <span>◈</span>
                          </span>
                          <span>
                            Peças de {name} <small>({abbr})</small>
                          </span>
                          <strong>{value}</strong>
                        </div>
                      ))}
                      <div className="coin-caption">
                        Cada moeda conta uma história.
                      </div>
                    </Panel>
                  </div>
                )}
                {inventory}
              </>
            )}
            {page === "Magias e Feitiços" && (
              <Panel
                title="Grimório do Personagem"
                icon="book"
                className="secondary-panel"
              >
                <div className="grimoire-empty">
                  <Icon name="book" size={52} />
                  <h2>A força da sua lâmina é a sua magia.</h2>
                  <p>
                    {character.name} é um {character.job.toLowerCase()}. Seu
                    grimório ainda não possui feitiços.
                  </p>
                  <button
                    className="red-button"
                    onClick={() => setModal("spell")}
                  >
                    <Icon name="plus" size={17} />
                    Registrar uma magia
                  </button>
                </div>
                {items
                  .filter((i) => i.type === "Magia")
                  .map((i) => (
                    <div className="spell-row" key={i.id}>
                      <Icon name="book" />
                      <strong>{i.name}</strong>
                      <span>{i.notes}</span>
                      <button
                        className="small-button"
                        onClick={() => setModal(`item-${i.id}`)}
                      >
                        Editar
                      </button>
                    </div>
                  ))}
              </Panel>
            )}
            {page === "Afastar e Esconjurar" && (
              <Panel
                title="Afastar e Esconjurar"
                icon="star"
                className="secondary-panel"
              >
                <div className="ritual-intro">
                  <Icon name="star" size={55} />
                  <h2>Contra as forças das trevas</h2>
                  <p>
                    Faça um lançamento de proteção e enfrente o desconhecido.
                  </p>
                </div>
                <div className="ritual-cards">
                  {[
                    ["Proteção contra Magia", "+6"],
                    ["Afastar Mortos-Vivos", "+6"],
                    ["Esconjurar Mortos-Vivos", "+4"],
                  ].map(([name, bonus]) => (
                    <div key={name}>
                      <Icon name="star" size={30} />
                      <h3>{name}</h3>
                      <strong>{bonus}</strong>
                      <button
                        className="red-button"
                        onClick={() => {
                          setModal("roll")
                          setRoll(null)
                        }}
                      >
                        Lançar d20
                      </button>
                    </div>
                  ))}
                </div>
              </Panel>
            )}
            {page === "Anotações de Campanha" && (
              <Panel
                title={`Crônicas de ${campaign}`}
                icon="scroll"
                className="secondary-panel"
                action={
                  <span className="notes-saved">
                    <Icon name="check" size={14} />
                    Salvo automaticamente
                  </span>
                }
              >
                <label className="notes-label" htmlFor="campaign-notes">
                  O diário da sua aventura
                </label>
                <textarea
                  id="campaign-notes"
                  className="campaign-notes"
                  value={notes}
                  onChange={(e) => setNotes(e.target.value)}
                  placeholder="Registre encontros, lugares e segredos do seu mundo…"
                />
                <p className="notes-hint">
                  Suas anotações ficam salvas neste navegador.
                </p>
              </Panel>
            )}
            <footer className="page-footer">
              <span>
                <Icon name="star" size={13} /> CRÔNICAS <i>·</i> CADA ESCOLHA,
                UMA NOVA HISTÓRIA.
              </span>
              <span>Que os dados estejam a seu favor.</span>
            </footer>
          </div>
        </main>
      </div>
      {toast && (
        <div className="toast" role="status">
          <Icon name="check" size={18} />
          {toast}
        </div>
      )}
      {modal && (
        <div className="modal-backdrop" onClick={() => setModal(null)}>
          <section
            className="modal panel"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modal-title"
            onClick={(e) => e.stopPropagation()}
          >
            <div className="panel-heading">
              <Icon name={modal === "roll" ? "target" : "edit"} />
              <h2 id="modal-title">
                {modal === "character"
                  ? "Editar Personagem"
                  : modal === "new-character"
                    ? "Novo Personagem"
                  : modal === "add"
                    ? "Adicionar Item"
                    : modal === "spell"
                      ? "Registrar Magia"
                      : modal === "hp"
                        ? "Pontos de Vida"
                        : modal.startsWith("stat-")
                          ? statLabels[Number(modal.split("-")[1])][1]
                          : modal === "stats"
                            ? "Editar Atributos"
                          : modal.startsWith("item-")
                            ? "Editar Item"
                            : modal === "roll"
                              ? "Lançamento de Dados"
                              : modal === "settings"
                                ? "Sua Ficha"
                                : modal === "breath"
                                  ? "Pontos de Respiro"
                                  : "Estatísticas de Combate"}
              </h2>
              <button
                className="close-button"
                aria-label="Fechar"
                onClick={() => setModal(null)}
              >
                <Icon name="close" />
              </button>
            </div>
            <div className="modal-body">
              {modal === "new-character" && (
                <form
                  onSubmit={(e) => {
                    e.preventDefault()
                    const name = String(
                      new FormData(e.currentTarget).get("name"),
                    ).trim()
                    const id = `personagem-${Date.now()}`
                    const newCharacter = { ...initialCharacter, name }
                    setSavedCharacters([
                      ...savedCharacters,
                      { id, name: newCharacter.name },
                    ])
                    setCharacter(newCharacter)
                    setItems([])
                    setStats([10, 10, 10, 10, 10, 10])
                    setBreath(5)
                    setNotes("")
                    setCampaign("Nova Campanha")
                    setActiveCharacterId(id)
                    setModal(null)
                    setToast("Novo personagem criado")
                  }}
                >
                  <p>
                    Crie uma ficha separada. Inventário, atributos e anotações
                    serão salvos apenas para este personagem.
                  </p>
                  <label className="stat-input">
                    Nome do personagem
                    <input
                      name="name"
                      placeholder="Ex.: Elara"
                      required
                      autoFocus
                    />
                  </label>
                  <button className="red-button modal-submit" type="submit">
                    <Icon name="plus" size={16} />
                    Criar personagem
                  </button>
                </form>
              )}
              {modal === "character" && (
                <form
                  onSubmit={(e) => {
                    e.preventDefault()
                    const data = new FormData(e.currentTarget)
                    setCharacter({
                      ...character,
                      name: String(data.get("name")),
                      race: String(data.get("race")),
                      job: String(data.get("job")),
                      alignment: String(data.get("alignment")),
                      languages: String(data.get("languages")),
                      background: String(data.get("background")),
                      quote: String(data.get("quote")),
                      level: Number(data.get("level")),
                    })
                    setCampaign(String(data.get("campaign")))
                    setModal(null)
                    setToast("Personagem atualizado")
                  }}
                >
                  <div className="form-grid">
                    {[
                      ["name", "Nome"],
                      ["race", "Raça"],
                      ["job", "Classe"],
                      ["alignment", "Alinhamento"],
                      ["languages", "Idiomas"],
                      ["background", "Antecedente"],
                      ["quote", "Lema"],
                    ].map(([key, label]) => (
                      <label
                        key={key}
                        className={key === "quote" ? "full-width" : ""}
                      >
                        {label}
                        <input
                          name={key}
                          defaultValue={String(
                            character[(key as keyof typeof character)],
                          )}
                          required
                        />
                      </label>
                    ))}
                    <label>
                      Nível
                      <input
                        name="level"
                        type="number"
                        min="1"
                        max="100"
                        defaultValue={character.level}
                        required
                      />
                    </label>
                    <label>
                      Campanha
                      <input
                        name="campaign"
                        defaultValue={campaign}
                        required
                      />
                    </label>
                  </div>
                  <button className="red-button modal-submit" type="submit">
                    <Icon name="check" size={16} />
                    Salvar alterações
                  </button>
                </form>
              )}
              {(modal === "add" ||
                modal === "spell" ||
                modal.startsWith("item-")) &&
                (() => {
                  const item = items.find((i) => `item-${i.id}` === modal)
                  return (
                    <form
                      onSubmit={(e) => {
                        e.preventDefault()
                        const data = new FormData(e.currentTarget)
                        const type = String(data.get("type"))
                        const next: Item = {
                          id: item?.id ?? Date.now(),
                          name: String(data.get("name")),
                          type,
                          location: String(data.get("location")),
                          weight: String(data.get("weight")),
                          quantity: Number(data.get("quantity")),
                          notes: String(data.get("notes")),
                          icon:
                            type === "Arma"
                              ? "sword"
                              : type === "Consumível"
                                ? "bottle"
                                : type === "Magia"
                                  ? "book"
                                  : "bag",
                        }
                        setItems(
                          item
                            ? items.map((i) => (i.id === item.id ? next : i))
                            : [...items, next],
                        )
                        setModal(null)
                        setToast(
                          item ? "Item atualizado" : "Adicionado à sua ficha",
                        )
                      }}
                    >
                      <div className="form-grid">
                        <label className="full-width">
                          Nome
                          <input
                            name="name"
                            defaultValue={item?.name}
                            placeholder="Nome do item ou magia"
                            required
                            autoFocus
                          />
                        </label>
                        <label>
                          Tipo
                          <select
                            name="type"
                            defaultValue={
                              item?.type ??
                              (modal === "spell" ? "Magia" : "Equipamento")
                            }
                          >
                            {[
                              "Armadura",
                              "Arma",
                              "Escudo",
                              "Equipamento",
                              "Consumível",
                              "Especial",
                              "Magia",
                            ].map((t) => (
                              <option key={t}>{t}</option>
                            ))}
                          </select>
                        </label>
                        <label>
                          Localização
                          <input
                            name="location"
                            defaultValue={item?.location ?? "Mochila"}
                          />
                        </label>
                        <label>
                          Peso
                          <input
                            name="weight"
                            defaultValue={item?.weight ?? "0 kg"}
                          />
                        </label>
                        <label>
                          Quantidade
                          <input
                            name="quantity"
                            type="number"
                            min="1"
                            defaultValue={item?.quantity ?? 1}
                            required
                          />
                        </label>
                        <label className="full-width">
                          Observações
                          <input
                            name="notes"
                            defaultValue={item?.notes}
                            placeholder="Dano, efeitos ou detalhes…"
                          />
                        </label>
                      </div>
                      <div className="modal-form-actions">
                        {item && (
                          <button
                            type="button"
                            className="small-button delete-button"
                            onClick={() => {
                              setItems(items.filter((i) => i.id !== item.id))
                              setModal(null)
                              setToast("Item removido")
                            }}
                          >
                            <Icon name="trash" size={16} />
                            Remover
                          </button>
                        )}
                        <button
                          className="red-button modal-submit"
                          type="submit"
                        >
                          Salvar item
                        </button>
                      </div>
                    </form>
                  )
                })()}
              {modal === "hp" && (
                <form
                  onSubmit={(e) => {
                    e.preventDefault()
                    const data = new FormData(e.currentTarget)
                    const maxHp = Number(data.get("max"))
                    setCharacter({
                      ...character,
                      hp: Math.min(Number(data.get("hp")), maxHp),
                      maxHp,
                    })
                    setModal(null)
                  }}
                >
                  <p>
                    Acompanhe os ferimentos e a recuperação do seu personagem.
                  </p>
                  <div className="form-grid">
                    <label>
                      PV atuais
                      <input
                        name="hp"
                        type="number"
                        min="0"
                        defaultValue={character.hp}
                        required
                        autoFocus
                      />
                    </label>
                    <label>
                      PV máximos
                      <input
                        name="max"
                        type="number"
                        min="1"
                        defaultValue={character.maxHp}
                        required
                      />
                    </label>
                  </div>
                  <button className="red-button modal-submit">
                    Atualizar pontos de vida
                  </button>
                </form>
              )}
              {modal.startsWith("stat-") && (
                <form
                  onSubmit={(e) => {
                    e.preventDefault()
                    const next = [...stats]
                    next[Number(modal.split("-")[1])] = Number(
                      new FormData(e.currentTarget).get("value"),
                    )
                    setStats(next)
                    setModal(null)
                  }}
                >
                  <label className="stat-input">
                    Valor do atributo
                    <input
                      type="number"
                      name="value"
                      min="1"
                      max="30"
                      defaultValue={stats[Number(modal.split("-")[1])]}
                      required
                      autoFocus
                    />
                  </label>
                  <p>
                    O modificador é calculado automaticamente a partir do valor
                    do atributo.
                  </p>
                  <button className="red-button modal-submit">
                    Salvar atributo
                  </button>
                </form>
              )}
              {modal === "stats" && (
                <form
                  onSubmit={(e) => {
                    e.preventDefault()
                    const data = new FormData(e.currentTarget)
                    setStats(
                      statLabels.map(([, label], index) =>
                        Number(data.get(`stat-${index}-${label}`)),
                      ),
                    )
                    setModal(null)
                    setToast("Atributos atualizados")
                  }}
                >
                  <p>
                    Distribua os pontos do personagem. Os modificadores são
                    calculados automaticamente.
                  </p>
                  <div className="stats-form-grid">
                    {statLabels.map(([abbr, label], index) => (
                      <label key={abbr} className="stat-input">
                        <span>
                          <strong>{abbr}</strong> · {label}
                        </span>
                        <input
                          type="number"
                          name={`stat-${index}-${label}`}
                          min="1"
                          max="30"
                          defaultValue={stats[index]}
                          required
                        />
                      </label>
                    ))}
                  </div>
                  <button className="red-button modal-submit" type="submit">
                    <Icon name="check" size={16} />
                    Salvar todos os atributos
                  </button>
                </form>
              )}
              {modal === "roll" && (
                <div className="dice-dialog">
                  <div className={`dice ${roll === 20 ? "critical" : ""}`}>
                    {roll ?? <Icon name="target" size={50} />}
                  </div>
                  <h3>
                    {roll === null
                      ? "O destino aguarda."
                      : roll === 20
                        ? "Acerto crítico!"
                        : roll === 1
                          ? "Falha crítica."
                          : "Seu destino foi lançado."}
                  </h3>
                  <p>Dado de 20 faces · Resultado sem modificadores</p>
                  <button
                    className="red-button"
                    onClick={() => setRoll(Math.floor(Math.random() * 20) + 1)}
                  >
                    <Icon name="target" size={18} />
                    {roll === null ? "Lançar d20" : "Lançar novamente"}
                  </button>
                </div>
              )}
              {modal === "settings" && (
                <>
                  <p>
                    Sua ficha e seu inventário são salvos automaticamente neste
                    navegador. Não é necessário criar uma conta.
                  </p>
                  <p>Guarde uma cópia para levar sua aventura a outro lugar.</p>
                  <button
                    className="red-button"
                    onClick={() => {
                      const url = URL.createObjectURL(
                        new Blob(
                          [
                            JSON.stringify(
                              {
                                character,
                                stats,
                                items,
                                notes,
                                campaign,
                                breath,
                              },
                              null,
                              2,
                            ),
                          ],
                          { type: "application/json" },
                        ),
                      )
                      const link = document.createElement("a")
                      link.href = url
                      link.download = `${character.name.toLowerCase()}-ficha.json`
                      link.click()
                      URL.revokeObjectURL(url)
                      setToast("Cópia da ficha exportada")
                    }}
                  >
                    <Icon name="scroll" size={17} />
                    Exportar minha ficha
                  </button>
                </>
              )}
              {modal === "breath" && (
                <>
                  <p>
                    Use os corações para acompanhar seus pontos de respiro
                    durante a sessão.
                  </p>
                  <p>
                    Clique em um coração para definir quantos pontos restam.
                    Clique novamente no último coração ativo para consumir um
                    ponto.
                  </p>
                  <button
                    className="red-button"
                    onClick={() => {
                      setBreath(5)
                      setModal(null)
                      setToast("Pontos de respiro recuperados")
                    }}
                  >
                    Recuperar todos os pontos
                  </button>
                </>
              )}
              {modal === "combat" && (
                <>
                  <p>Estatísticas de combate de {character.name}.</p>
                  <div className="combat-details">
                    {summary.slice(1).map(([, label, value]) => (
                      <div key={label}>
                        <span>{label}</span>
                        <strong>{value}</strong>
                      </div>
                    ))}
                  </div>
                  <button
                    className="red-button"
                    onClick={() => {
                      setModal("roll")
                      setRoll(null)
                    }}
                  >
                    <Icon name="target" size={17} />
                    Fazer um lançamento
                  </button>
                </>
              )}
            </div>
          </section>
        </div>
      )}
    </div>
  )
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
